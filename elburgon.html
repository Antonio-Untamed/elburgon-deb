<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
body { margin:0; background:#0033A0; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Montserrat',sans-serif; overflow:hidden; }
.flag { text-align:center; padding:50px; background:linear-gradient(135deg,#0033A0,#0044CC); border:6px solid #FFD700; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.6); animation:wave 3s ease-in-out infinite; }
.crest { font-size:60px; }
.name { color:white; font-size:64px; font-weight:900; text-shadow:3px 3px 0 #000; animation:down 1s ease-out; }
.sub { color:white; font-size:32px; font-weight:800; animation:down 1.2s ease-out; }
.contact { color:#FFD700; font-size:28px; font-weight:800; margin:12px 0; animation:fade 2s ease-out; }
.motto { color:#FFD700; font-size:24px; font-style:italic; margin-top:15px; animation:fade 2.5s ease-out; }
@keyframes wave { 0%,100%{transform:rotate(-1deg) scale(1)} 50%{transform:rotate(1deg) scale(1.03)} }
@keyframes down { from{opacity:0; transform:translateY(-40px)} to{opacity:1; transform:translateY(0)} }
@keyframes fade { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<div class="flag">
<div class="crest">👑📖</div>
<div class="name">ELBURGON DEB</div>
<div class="sub">PRIMARY & JUNIOR SCHOOL</div>
<div class="contact">📍 Location: Elburgon</div>
<div class="contact">📞 0721913822</div>
<div class="motto">"STRIVE FOR THE BEST"</div>
</div>
</body>
</html>
